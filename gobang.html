<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子棋 | Blog</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #f5f5f7; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  .gobang-page { width: 100%; max-width: 600px; margin: 80px auto 40px; padding: 24px 20px 32px;
    background: #fff; border-radius: 16px; box-shadow: 0 2px 24px rgba(0,0,0,0.08); text-align: center; }

  .gobang-title { font-size: 36px; font-family: 'SimSun', serif; color: #1a1a2e; margin-bottom: 12px; }
  .gobang-emoji { font-size: 36px; margin-bottom: 12px; }

  /* 棋盘 */
  .gobang-card { width: 96%; max-width: 560px; margin: 0 auto; padding: 16px 10px; border-radius: 16px; background: #fff; text-align: center; }
  .status { font-size: 22px; margin-bottom: 14px; font-weight: 500; letter-spacing: 1px; color: #2d2d3a; }
  .board-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
  .board { position: relative; display: grid; grid-template-columns: repeat(9, 42px); grid-template-rows: repeat(9, 42px); gap: 0; padding: 0; background: transparent; }
  .board::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(0,0,0,0.10) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.10) 1px, transparent 1px); background-size: 42px 42px; background-position: 21px 21px; z-index: 1; }
  .cell { width: 42px; height: 42px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; z-index: 2; }
  .cell:hover::after { content: ""; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,0.08); }
  .cell.black::after { content: ""; width: 30px; height: 30px; border-radius: 50%; background: #1a1a1a; }
  .cell.white::after { content: ""; width: 30px; height: 30px; border-radius: 50%; background: #fafafa; box-shadow: 0 0 0 1.5px rgba(0,0,0,0.13), 0 2px 4px rgba(0,0,0,0.12); }
  .diff-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
  .diff-btn { padding: 6px 18px; border: 1px solid rgba(0,0,0,0.18); border-radius: 6px; background: transparent; color: rgba(0,0,0,0.55); font-size: 16px; cursor: pointer; transition: all 0.2s; }
  .diff-btn.active { background: rgba(94,234,212,0.12); color: #0ea88a; border-color: #0ea88a; }
  .diff-btn:hover { color: #1a1a2e; border-color: rgba(0,0,0,0.4); }
  .reset-btn { padding: 10px 26px; border: none; border-radius: 10px; background: #ff7d45; color: #fff; font-size: 16px; cursor: pointer; transition: all 0.2s; }
  .reset-btn:hover { background: #ff6a2c; transform: scale(1.03); }

  .back-link { margin-top: 24px; }
  .back-link a { color: var(--muted); font-size: 0.85rem; transition: color 0.2s; }
  .back-link a:hover { color: var(--accent); }

  @media (max-width: 600px) {
    .board { grid-template-columns: repeat(9, 36px); grid-template-rows: repeat(9, 36px); }
    .board::before { background-size: 36px 36px; background-position: 18px 18px; }
    .cell { width: 36px; height: 36px; }
    .cell.black::after, .cell.white::after { width: 26px; height: 26px; }
    .cell:hover::after { width: 20px; height: 20px; }
    .gobang-page { margin: 70px 8px 20px; padding: 16px 8px 24px; }
  }
</style>
</head>
<body>

<header class="topbar" style="
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: space-between;
  height: 52px; padding: 0 32px;
  background: rgba(34,37,41,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-size: 0.9rem;
">
  <a href="index.html" style="font-weight:800;letter-spacing:1px;text-shadow:0 12px 5px #94c8ff;color:#eeeef2;font-size:35px;font-family:'Georgia',serif;">A Radish ～ Blog</a>
  <nav style="display:flex;gap:24px;">
    <a href="index.html" style="color:#a0a0b0;font-size:0.875rem;font-weight:500;transition:color 0.2s;white-space:nowrap;" onmouseenter="this.style.color='#5eead4'" onmouseleave="this.style.color='#a0a0b0'">首页</a>
  </nav>
</header>

<div class="gobang-page">
  <div class="gobang-title">五子棋小游戏</div>
  <div class="gobang-emoji">&#128512; &#128516; &#128525; &#128151;</div>

  <div class="gobang-card">
    <div class="diff-row" id="diffRow">
      <button class="diff-btn" data-lvl="0">简单</button>
      <button class="diff-btn active" data-lvl="1">普通</button>
      <button class="diff-btn" data-lvl="2">困难</button>
      <button class="diff-btn" data-lvl="3">地狱</button>
    </div>
    <div class="status" id="status">你先行（黑棋）</div>
    <div class="board-wrap"><div class="board" id="board"></div></div>
    <button class="reset-btn" id="resetBtn">重新开始</button>
  </div>

  <div class="back-link"><a href="index.html">← 返回首页</a></div>
</div>

<script>
(function(){
const statusText=document.getElementById('status');
const boardEl=document.getElementById('board');
const resetBtn=document.getElementById('resetBtn');
const size=9;let cells=[],gameOver=false,isAiTurn=false;
const human='black',ai='white';

function initBoard(){
  boardEl.innerHTML='';cells=[];gameOver=false;isAiTurn=false;
  statusText.textContent='你先行（黑棋）';
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const div=document.createElement('div');
    div.className='cell';div.dataset.x=x;div.dataset.y=y;
    boardEl.appendChild(div);cells.push(div);
    div.addEventListener('click',cellClick);
  }
}
function getCell(x,y){if(x<0||x>=size||y<0||y>=size)return null;return cells[y*size+x];}
function has(t,x,y){const c=getCell(x,y);return c?c.classList.contains(t):false;}
function isEmpty(x,y){const c=getCell(x,y);return c?!c.classList.contains('black')&&!c.classList.contains('white'):false;}
function checkWin(t,x,y){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(let[dx,dy]of dirs){let c=1,cx=x+dx,cy=y+dy;
    while(has(t,cx,cy)){c++;cx+=dx;cy+=dy;}
    cx=x-dx;cy=y-dy;
    while(has(t,cx,cy)){c++;cx-=dx;cy-=dy;}
    if(c>=5)return true;
  }return false;
}
function getEmpty(){const a=[];cells.forEach(c=>{if(!c.classList.contains('black')&&!c.classList.contains('white'))a.push({x:+c.dataset.x,y:+c.dataset.y,el:c});});return a;}
function lockAll(){cells.forEach(c=>c.style.pointerEvents='none');}

/* ── 简单AI ── */
function posScore(type,x,y){
  let s=0;const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(let[dx,dy]of dirs){
    let cnt=1,open=0,cx=x+dx,cy=y+dy;
    while(has(type,cx,cy)){cnt++;cx+=dx;cy+=dy;}
    if(isEmpty(cx,cy))open++;
    cx=x-dx;cy=y-dy;
    while(has(type,cx,cy)){cnt++;cx-=dx;cy-=dy;}
    if(isEmpty(cx,cy))open++;
    if(cnt>=5)s+=100000;
    else if(cnt===4)s+=open===2?50000:open===1?5000:0;
    else if(cnt===3)s+=open===2?3000:open===1?500:0;
    else if(cnt===2)s+=open===2?200:open===1?50:0;
    else s+=open*5;
  }return s;
}

/* ── 普通难度及以上AI ── */
function getCandidates(){
  const list=[];
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    if(!isEmpty(x,y))continue;
    let score=0;
    const el=getCell(x,y);el.classList.add(ai);
    score+=posScore(ai,x,y);
    el.classList.remove(ai);
    el.classList.add(human);
    score+=posScore(human,x,y)*1.05;
    el.classList.remove(human);
    if(score>0)list.push({x,y,score});
  }
  list.sort((a,b)=>b.score-a.score);
  if(list.length===0)return [{x:4,y:4}];
  return list;
}

function evaluate(){
  let aiScore=0,humanScore=0;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    if(has(ai,x,y))aiScore+=posScore(ai,x,y);
    else if(has(human,x,y))humanScore+=posScore(human,x,y);
  }
  return aiScore-humanScore*1.05;
}

const DIFFS=[
  {name:'普通',depth:0,top:0,inner:0,def:0.4,rng:2,delay:300},
  {name:'困难',depth:1,top:5,inner:3,def:1.0,rng:1,delay:200},
  {name:'地狱',depth:2,top:12,inner:8,def:1.2,rng:1,delay:100},
];
let diffLvl=1;

function aiMove(){
  if(gameOver)return;

  /* ── 简单模式：贪心算法 ── */
  if(diffLvl===0){
    const empty=getEmpty();let target=null;
    for(let p of empty){p.el.classList.add(ai);if(checkWin(ai,p.x,p.y))target=p;p.el.classList.remove(ai);if(target)break;}
    if(!target)for(let p of empty){p.el.classList.add(human);if(checkWin(human,p.x,p.y))target=p;p.el.classList.remove(human);if(target)break;}
    if(!target){const c=empty.find(p=>p.x===4&&p.y===4);if(c)target=c;}
    if(!target)target=empty[Math.floor(Math.random()*empty.length)];
    target.el.classList.add(ai);
    if(checkWin(ai,target.x,target.y)){statusText.textContent='AI白棋获胜！';gameOver=true;lockAll();return;}
    if(getEmpty().length===0){statusText.textContent='平局！';gameOver=true;lockAll();return;}
    statusText.textContent='轮到你落子（黑棋）';isAiTurn=false;
    return;
  }

  const cfg=DIFFS[diffLvl-1];
  const cands=getCandidates();if(cands.length===0)return;
  let bestMove=cands[0],bestScore=-Infinity;

  const innerMinimax=function(depth,alpha,beta,maximizing){
    const cs=getCandidates();
    if(cs.length===0||depth<=0)return evaluate();
    if(maximizing){
      let best=-Infinity;
      for(let p of cs.slice(0,cfg.inner)){
        const el=getCell(p.x,p.y);el.classList.add(ai);
        if(checkWin(ai,p.x,p.y)){el.classList.remove(ai);return 1e9+depth;}
        const v=innerMinimax(depth-1,alpha,beta,false);
        el.classList.remove(ai);if(v>best)best=v;
        if(best>alpha)alpha=best;if(alpha>=beta)break;
      }return best;
    }else{
      let best=Infinity;
      for(let p of cs.slice(0,cfg.inner)){
        const el=getCell(p.x,p.y);el.classList.add(human);
        if(checkWin(human,p.x,p.y)){el.classList.remove(human);return -1e9-depth;}
        const v=innerMinimax(depth-1,alpha,beta,true);
        el.classList.remove(human);if(v<best)best=v;
        if(best<beta)beta=best;if(alpha>=beta)break;
      }return best;
    }
  };

  const rng=cfg.rng||1;
  if(rng>1){
    const pool=cands.slice(0,rng);
    bestMove=pool[Math.floor(Math.random()*pool.length)];
  }else{
    const pool=cands.slice(0,cfg.top||cands.length);
    for(let p of pool){
      const el=getCell(p.x,p.y);el.classList.add(ai);
      if(checkWin(ai,p.x,p.y)){el.classList.remove(ai);bestMove=p;break;}
      const score=innerMinimax(cfg.depth,-Infinity,Infinity,false);
      el.classList.remove(ai);if(score>bestScore){bestScore=score;bestMove=p;}
    }
  }

  const target=getCell(bestMove.x,bestMove.y);target.classList.add(ai);
  if(checkWin(ai,bestMove.x,bestMove.y)){statusText.textContent='AI白棋获胜！';gameOver=true;lockAll();return;}
  if(getCandidates().length===0){statusText.textContent='平局！';gameOver=true;lockAll();return;}
  statusText.textContent='轮到你落子（黑棋）';isAiTurn=false;
}

document.querySelectorAll('.diff-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.diff-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    diffLvl=+btn.dataset.lvl;
    initBoard();
  });
});

function cellClick(e){
  if(gameOver||isAiTurn)return;const cell=e.target;
  if(cell.classList.contains('black')||cell.classList.contains('white'))return;
  const x=+cell.dataset.x,y=+cell.dataset.y;
  cell.classList.add(human);
  if(checkWin(human,x,y)){statusText.textContent='你获胜！';gameOver=true;lockAll();return;}
  if(getEmpty().length===0){statusText.textContent='平局！';gameOver=true;lockAll();return;}
  statusText.textContent='AI思考中...';isAiTurn=true;
  setTimeout(aiMove,diffLvl===0?400:DIFFS[diffLvl-1].delay);
}
resetBtn.addEventListener('click',initBoard);
initBoard();
})();
</script>

</body>
</html>
